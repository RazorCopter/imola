# Reverse proxy: unico ingresso su porta non privilegiata (8080).
# Static e media sono serviti da qui, non da Django.
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:8081;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 30m;

    # Dietro il reverse proxy di Synology o un load balancer con TLS.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /health {
        proxy_pass http://backend/health;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://backend/admin/;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # I file caricati stanno fuori dalla webroot e sono serviti solo a utenti autenticati
    # tramite il backend; qui passano dal controllo di accesso di Django.
    location /media/ {
        internal;
        alias /srv/media/;
    }

    location /download/ {
        proxy_pass http://backend/api/v1/download/;
    }

    location / {
        proxy_pass http://frontend/;
    }
}
