# Serve la SPA. Il routing lato client ricade su index.html.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gli asset con hash nel nome sono immutabili.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
