# Stack di produzione Imola.
# Configurabile tramite variabili ambiente Portainer.
# I dati persistenti risiedono sotto SL_DATA_DIR.

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplier_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-supplier_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Serve POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=it_IT.UTF-8 --lc-collate=C"

    volumes:
      - ${SL_DATA_DIR:-./.docker-data}/pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-supplier_ledger} -d ${POSTGRES_DB:-supplier_ledger}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: prod

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Serve DJANGO_SECRET_KEY}

      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}

      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}

      POSTGRES_DB: ${POSTGRES_DB:-supplier_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-supplier_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      MEDIA_ROOT: /srv/media
      BACKUP_DIR: /srv/backups

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}

      RESIDUAL_EXPIRING_WINDOW_DAYS: ${RESIDUAL_EXPIRING_WINDOW_DAYS:-90}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      LOGIN_THROTTLE_RATE: ${LOGIN_THROTTLE_RATE:-10/min}

      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}

    volumes:
      - ${SL_DATA_DIR:-./.docker-data}/media:/srv/media
      - ${SL_DATA_DIR:-./.docker-data}/static:/srv/static
      - ${SL_DATA_DIR:-./.docker-data}/backups:/srv/backups
      - ${SL_DATA_DIR:-./.docker-data}/seed:/srv/seed:ro

    command:
      - /bin/sh
      - -c
      - "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py bootstrap_roles && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120 --access-logfile - --error-logfile -"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/session')\" >/dev/null 2>&1 || test $$? -eq 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      target: prod

    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s


  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_healthy

    ports:
      - "${SL_HTTP_PORT:-8080}:8080"

    volumes:
      - ${SL_DATA_DIR:-./.docker-data}/static:/srv/static:ro
      - ${SL_DATA_DIR:-./.docker-data}/media:/srv/media:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
