# Stack di produzione, compatibile con Synology Container Manager:
# nessuna porta privilegiata, volumi bind sotto SL_DATA_DIR, healthcheck su ogni servizio.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplier_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-supplier_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Serve POSTGRES_PASSWORD nel file .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=it_IT.UTF-8 --lc-collate=C"
    volumes:
      - ${SL_DATA_DIR:-./.docker-data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplier_ledger} -d ${POSTGRES_DB:-supplier_ledger}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Serve DJANGO_SECRET_KEY nel file .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      POSTGRES_DB: ${POSTGRES_DB:-supplier_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-supplier_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      MEDIA_ROOT: /srv/media
      BACKUP_DIR: /srv/backups
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${SL_DATA_DIR:-./.docker-data}/media:/srv/media
      - ${SL_DATA_DIR:-./.docker-data}/static:/srv/static
      - ${SL_DATA_DIR:-./.docker-data}/backups:/srv/backups
      - ${SL_DATA_DIR:-./.docker-data}/seed:/srv/seed:ro
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py bootstrap_roles &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2
             --timeout 120 --access-logfile - --error-logfile -"

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      target: prod
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${SL_HTTP_PORT:-8080}:8080"
    volumes:
      - ${SL_DATA_DIR:-./.docker-data}/static:/srv/static:ro
      - ${SL_DATA_DIR:-./.docker-data}/media:/srv/media:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
