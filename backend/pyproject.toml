[project]
name = "supplier-ledger-backend"
version = "0.1.0"
description = "Gestione consuntivazione e wallet del fornitore Imola Informatica"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "DTZ", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
  "config", "core", "directory", "projects", "canone", "wallet", "timesheets",
  "ppm", "anomalies", "imports", "domain", "importers", "exports", "api",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pandas.*", "simple_history.*", "factory.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "seedfile: richiede il seed reale in data/seed/ (skippato se assente)",
]

[tool.coverage.run]
source = ["domain", "importers"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
