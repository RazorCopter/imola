# Sviluppo: codice montato, runserver con autoreload, Vite in hot reload,
# porta del database esposta per gli strumenti locali.
services:
  db:
    ports:
      - "${SL_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplier_ledger}

  backend:
    build:
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: "True"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplier_ledger}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MEDIA_ROOT: /srv/media
    volumes:
      - ./backend:/app
      - ./data/seed:/srv/seed:ro
      - ${SL_DATA_DIR:-./.docker-data}/media:/srv/media
      - ${SL_DATA_DIR:-./.docker-data}/static:/srv/static
      - ${SL_DATA_DIR:-./.docker-data}/backups:/srv/backups
    ports:
      - "${SL_BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py bootstrap_roles &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 8081
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${SL_FRONTEND_PORT:-5173}:8081"

volumes:
  frontend_node_modules:
